[[kernelarch]]
name = 'x86'
  [[kernelarch.debianarch]]
  name = 'amd64'

[[featureset]]
name = 'none'

[[debianrelease]]
name_regex = 'UNRELEASED'
abi_version_full = false
abi_suffix = '+unreleased'

[[debianrelease]]
name_regex = 'experimental'
abi_version_full = false
revision_regex = '\d+~exp\d+'

[[debianrelease]]
name_regex = 'unstable'
abi_suffix = '+deb14'
revision_regex = '\d+(\.\d+)?'

[[debianrelease]]
name_regex = 'forky(-security)?'
abi_suffix = '+deb14'
revision_regex = '\d+(\.\d+)?(\+deb14u\d+)?'

[[debianrelease]]
name_regex = 'trixie-backports'
abi_suffix = '+deb13'
revision_regex = '\d+(\.\d+)?(\+deb14u\d+)?~bpo13\+\d+'

[[debianrelease]]
name_regex = 'trixie(-security)?'
abi_suffix = '+deb13'
revision_regex = '\d+(\.\d+)?(\+deb13u\d+)?'

[[debianrelease]]
name_regex = 'bookworm-backports'
abi_suffix = '+deb12'
revision_regex = '\d+(\.\d+)?(\+deb13u\d+)?~bpo12\+\d+'

[[debianrelease]]
name_regex = 'lernstick-13(-backports)?'
abi_suffix = '+deb13'
revision_regex = '\d+(\.\d+)?(\+deb14u\d+)?~bpo13\+lernstick\.\d+'

# Use default rules for any suite with no explicit config
[[debianrelease]]
name_regex = '.*'

[description.long]
rt = 'This kernel is configured with PREEMPT_RT real time support.'
[description.short]
rt = 'PREEMPT_RT'

[build]
compiler = 'gcc-14'
trusted_certs = 'lernstick-6.17.8-1~bpo13+lernstick.1.pem'

[relations.image]
depends = [
  'initramfs-tools (>= 0.120+deb8u2) | linux-initramfs-tool',
]
recommends = [
  'apparmor',
]
breaks = [
  'fwupdate (<< 12-7)',
  'wireless-regdb (<< 2019.06.03-1~)',
]
